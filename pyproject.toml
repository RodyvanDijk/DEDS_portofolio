[project]
name = "DEDS_portofolio"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "SE4", email = "rody.van.dijk@gmail.com"},
]
dependencies = ["pandas>=2.2.3", "ipykernel>=6.29.5", "pyodbc>=5.2.0", "pandas-access>=0.0.1", "sklearn>=0.0.post12", "scikit-learn>=1.6.1", "matplotlib>=3.10.1", "pygame>=2.6.1"]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
